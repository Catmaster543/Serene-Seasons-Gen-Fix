# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=2.1.2
group=com.fiskerz.seasonsfix
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Serene_Seasons_GenFix
mod_author=Fiskerz
mod_id=seasonsfix
license=MIT
credits=
description=Aims to fix an issue when generating new chunks caused by serene seasons.
## Maven-style range used by the Forge/NeoForge mods.toml minecraft dependency.
minecraft_version_range=[1.21,1.21.12)
## Fabric uses its own predicate syntax rather than Maven ranges, so it needs its own property.
fabric_minecraft_version_range=>=1.21 <1.21.12
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# Forge
forge_version=52.0.28
forge_loader_version_range=[52,)
## Forge bumps its major version per Minecraft release: 52=1.21.1 ... 61=1.21.11, so 62 is the
## first build for a Minecraft version outside minecraft_version_range above.
forge_version_range=[52.0.28,62)

# NeoForge
neoforge_version=21.1.216
neoforge_loader_version_range=[4,)
## NeoForge's minor tracks the Minecraft patch: 21.1=1.21.1 ... 21.11=1.21.11.
neoforge_version_range=[21,21.12)

# Serene Seasons - the mod this one exists to patch, so it is a hard requirement.
## Deliberately an open-ended floor. Serene Seasons renumbered partway through 1.21.x
## (10.1.0.x for 1.21.1, 10.4.0.x for 1.21.4, then 21.11.0.x for 1.21.11), so any upper bound
## would break somewhere in the middle of minecraft_version_range. 10.1 is the 1.21.1-era
## release and 21.11 still compares greater, so this floor holds across the whole range.
sereneseasons_version_range=[10.0,)
## Fabric predicate form of the same constraint.
fabric_sereneseasons_version_range=>=10.1

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
